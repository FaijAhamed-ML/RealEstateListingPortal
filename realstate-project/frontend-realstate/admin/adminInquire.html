<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry Management — EstateView</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet" />
    <style>
      * { font-family: 'DM Sans', sans-serif; }
      h1, h2, .serif { font-family: 'DM Serif Display', serif; }

      body {
        background-color: #f5f2ee;
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: 240px;
        background: #1a1a1a;
        display: flex;
        flex-direction: column;
        padding: 32px 0;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }
      .sidebar::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 50% at 20% 80%, rgba(180,160,120,0.1) 0%, transparent 70%),
          radial-gradient(ellipse 50% 60% at 80% 20%, rgba(120,100,70,0.08) 0%, transparent 70%);
        pointer-events: none;
      }
      .sidebar .brand {
        font-family: 'DM Serif Display', serif;
        font-size: 22px;
        color: #fff;
        padding: 0 24px;
        margin-bottom: 6px;
        position: relative;
        z-index: 2;
      }
      .sidebar .brand-sub {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8a7f72;
        padding: 0 24px;
        margin-bottom: 32px;
        position: relative;
        z-index: 2;
      }
      .sidebar nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 0 12px;
        position: relative;
        z-index: 2;
      }
      .sidebar nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 10px;
        color: #8a7f72;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.15s, color 0.15s;
      }
      .sidebar nav a:hover {
        background: rgba(255,255,255,0.06);
        color: #d6d0c8;
      }
      .sidebar nav a.active {
        background: rgba(255,255,255,0.08);
        color: #fff;
        border-left: 3px solid #c9b99a;
      }
      .sidebar .logout-btn {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        margin-left: 12px;
        margin-right: 12px;
        border-radius: 10px;
        color: #8a7f72;
        font-size: 14px;
        font-weight: 500;
        background: none;
        border: none;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        width: calc(100% - 24px);
        text-align: left;
        position: relative;
        z-index: 2;
      }
      .sidebar .logout-btn:hover {
        background: rgba(220,80,80,0.1);
        color: #e24b4a;
      }

      /* Stat cards */
      .stat-card {
        background: #fff;
        border-radius: 16px;
        padding: 20px 24px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      }
      .stat-card .stat-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9a9189;
        margin-bottom: 6px;
      }
      .stat-card .stat-value {
        font-family: 'DM Serif Display', serif;
        font-size: 28px;
        color: #1a1a1a;
      }

      /* Table container */
      .table-wrap {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        overflow: hidden;
      }
      .table-wrap table {
        width: 100%;
        font-size: 14px;
        border-collapse: collapse;
      }
      .table-wrap thead tr {
        border-bottom: 1.5px solid #e8e3dc;
      }
      .table-wrap thead th {
        text-align: left;
        padding: 16px 24px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9a9189;
      }
      .table-wrap thead th:last-child { text-align: right; }
      .table-wrap tbody tr {
        border-bottom: 1px solid #f0ece6;
        transition: background 0.15s;
      }
      .table-wrap tbody tr:hover {
        background: #faf8f5;
      }
      .table-wrap tbody td {
        padding: 14px 24px;
        color: #6b6259;
      }

      /* Delete button */
      .delete-btn {
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        color: #c0392b;
        background: rgba(192,57,43,0.08);
        border: 1px solid rgba(192,57,43,0.15);
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .delete-btn:hover {
        background: rgba(192,57,43,0.15);
        border-color: rgba(192,57,43,0.3);
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal-card {
        background: #fff;
        border-radius: 20px;
        padding: 32px;
        width: 100%;
        max-width: 400px;
        margin: 0 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      }
      .btn-cancel {
        flex: 1;
        padding: 12px 20px;
        border-radius: 10px;
        border: 1.5px solid #d6d0c8;
        background: transparent;
        color: #6b6259;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-delete {
        flex: 1;
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        background: #c0392b;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }

      /* Search */
      .search-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1.5px solid #ddd8d0;
        border-radius: 10px;
        padding: 10px 14px;
        width: 280px;
      }
      .search-wrap input {
        border: none;
        outline: none;
        font-size: 14px;
        width: 100%;
      }

      .toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        background: #1a1a1a;
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 14px;
        z-index: 999;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s, transform 0.3s;
      }
      .toast.show { opacity: 1; transform: translateY(0); }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid #e8e3dc;
        border-top-color: #7c6f5e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">EstateView</div>
        <div class="brand-sub">Admin Panel</div>

        <nav>
            <a href="adminDashboard.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Dashboard
            </a>
            <a href="AdminView.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Users
            </a>
            <a href="adminProperties.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
                Properties
            </a>
            <a href="adminInquire.html" class="active">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                </svg>
                Inquiries
            </a>
        </nav>

        <button onclick="logout()" class="logout-btn">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Logout
        </button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10 overflow-x-auto">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl text-stone-900 leading-none">Inquiry Management</h1>
                <p class="text-sm text-stone-400 mt-1">View and manage all property inquiries</p>
            </div>
            <div class="search-wrap">
                <svg width="16" height="16" fill="none" stroke="#b0a898" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input id="searchInput" type="text" placeholder="Search inquiries..." oninput="filterInquiries()"/>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-5 mb-8">
            <div class="stat-card">
                <p class="stat-label">Total Inquiries</p>
                <p id="totalInquiries" class="stat-value">—</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Showing</p>
                <p id="showingInquiries" class="stat-value" style="color: #7c6f5e;">—</p>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Inquirer</th>
                        <th>Contact</th>
                        <th>Property</th>
                        <th>Owner ID</th>
                        <th>Message</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="inquiriesTableBody"></tbody>
            </table>

            <div id="loadingState" class="py-20 text-center">
                <div class="spinner"></div>
                <p class="text-sm text-stone-500">Loading inquiries...</p>
            </div>

            <div id="emptyState" class="hidden py-20 text-center text-stone-400">
                <p class="text-lg">No inquiries found.</p>
            </div>
        </div>
    </main>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="flex items-center gap-4 mb-4">
                <div style="width:44px;height:44px;border-radius:50%;background:rgba(192,57,43,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <svg width="22" height="22" fill="none" stroke="#c0392b" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg text-stone-900 serif">Delete Inquiry</h3>
                    <p class="text-sm text-stone-400">This action cannot be undone.</p>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeModal()" class="btn-cancel">Cancel</button>
                <button onclick="confirmDelete()" class="btn-delete">Delete</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = "http://localhost:8080";
        let allInquiries = [];
        let deleteTargetId = null;

        async function fetchInquiries() {
            try {
                const res = await fetch(`${API_BASE}/api/inquire/all`);
                if (!res.ok) throw new Error("Failed to fetch");
                allInquiries = await res.json();
                
                document.getElementById("loadingState").classList.add("hidden");
                updateStats(allInquiries.length);
                renderTable(allInquiries);
            } catch (err) {
                document.getElementById("loadingState").innerHTML =
                    `<p class="text-sm" style="color:#c0392b;">Failed to load inquiries. Is the server running?</p>`;
            }
        }

        function renderTable(list) {
            const tbody = document.getElementById("inquiriesTableBody");
            const empty = document.getElementById("emptyState");

            if (list.length === 0) {
                tbody.innerHTML = "";
                empty.classList.remove("hidden");
                document.getElementById("showingInquiries").textContent = 0;
                return;
            }

            empty.classList.add("hidden");
            document.getElementById("showingInquiries").textContent = list.length;

            tbody.innerHTML = list.map(inq => `
                <tr>
                    <td style="font-family: monospace; font-size: 12px; color: #9a9189;">#${inq.id || '—'}</td>
                    <td>
                        <div class="flex flex-col">
                            <span style="font-weight: 500; color: #1a1a1a;">${inq.name || 'Anonymous'}</span>
                            <span style="font-size: 10px; color: #b0a898;">ID: #${inq.userId}</span>
                        </div>
                    </td>
                    <td>${inq.contactNumber || '—'}</td>
                    <td>
                        <div class="flex flex-col">
                            <span class="badge" style="background: #f0ece6; color: #6b6259; border: 1px solid #e8e3dc; padding: 2px 8px; font-size: 11px; border-radius: 4px; width: fit-content;">Prop #${inq.propertyId}</span>
                            <span style="font-size: 10px; color: #b0a898; margin-top: 2px;">${inq.propertyDetails || '—'}</span>
                        </div>
                    </td>
                    <td>
                        <div class="flex flex-col">
                            <span style="font-weight: 500; color: #1a1a1a;">${inq.ownerName || 'Unknown'}</span>
                            <span style="font-size: 10px; color: #b0a898;">ID: #${inq.ownerId || '—'}</span>
                        </div>
                    </td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${inq.description}">${inq.description || '—'}</td>
                    <td style="text-align: right;">
                        <button onclick="openDeleteModal(${inq.id})" class="delete-btn">Delete</button>
                    </td>
                </tr>
            `).join("");
        }

        function filterInquiries() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allInquiries.filter(inq => 
                (inq.name || '').toLowerCase().includes(q) ||
                (inq.description || '').toLowerCase().includes(q) ||
                String(inq.propertyId).includes(q) ||
                String(inq.id).includes(q)
            );
            renderTable(filtered);
        }

        function updateStats(total) {
            document.getElementById("totalInquiries").textContent = total;
            document.getElementById("showingInquiries").textContent = total;
        }

        function openDeleteModal(id) {
            deleteTargetId = id;
            document.getElementById("deleteModal").classList.remove("hidden");
        }

        function closeModal() {
            deleteTargetId = null;
            document.getElementById("deleteModal").classList.add("hidden");
        }

        async function confirmDelete() {
            if (!deleteTargetId) return;
            try {
                const res = await fetch(`${API_BASE}/api/admin/inquires/${deleteTargetId}`, { method: "DELETE" });
                if (!res.ok) throw new Error("Delete failed");
                
                allInquiries = allInquiries.filter(inq => inq.id !== deleteTargetId);
                updateStats(allInquiries.length);
                renderTable(allInquiries);
                showToast("Inquiry deleted successfully");
            } catch (err) {
                showToast("Failed to delete inquiry");
            } finally {
                closeModal();
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 3000);
        }

        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "../user/login.html";
        }

        fetchInquiries();
    </script>
</body>
</html>
