<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management — EstateView</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet" />
    <style>
      * { font-family: 'DM Sans', sans-serif; }
      h1, h2, .serif { font-family: 'DM Serif Display', serif; }

      body {
        background-color: #f5f2ee;
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: 240px;
        background: #1a1a1a;
        display: flex;
        flex-direction: column;
        padding: 32px 0;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }
      .sidebar::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 50% at 20% 80%, rgba(180,160,120,0.1) 0%, transparent 70%),
          radial-gradient(ellipse 50% 60% at 80% 20%, rgba(120,100,70,0.08) 0%, transparent 70%);
        pointer-events: none;
      }
      .sidebar .brand {
        font-family: 'DM Serif Display', serif;
        font-size: 22px;
        color: #fff;
        padding: 0 24px;
        margin-bottom: 6px;
        position: relative;
        z-index: 2;
      }
      .sidebar .brand-sub {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8a7f72;
        padding: 0 24px;
        margin-bottom: 32px;
        position: relative;
        z-index: 2;
      }
      .sidebar nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 0 12px;
        position: relative;
        z-index: 2;
      }
      .sidebar nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 10px;
        color: #8a7f72;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.15s, color 0.15s;
      }
      .sidebar nav a:hover {
        background: rgba(255,255,255,0.06);
        color: #d6d0c8;
      }
      .sidebar nav a.active {
        background: rgba(255,255,255,0.08);
        color: #fff;
        border-left: 3px solid #c9b99a;
      }
      .sidebar .logout-btn {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        margin-left: 12px;
        margin-right: 12px;
        border-radius: 10px;
        color: #8a7f72;
        font-size: 14px;
        font-weight: 500;
        background: none;
        border: none;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        width: calc(100% - 24px);
        text-align: left;
        position: relative;
        z-index: 2;
      }
      .sidebar .logout-btn:hover {
        background: rgba(220,80,80,0.1);
        color: #e24b4a;
      }

      /* Stat cards */
      .stat-card {
        background: #fff;
        border-radius: 16px;
        padding: 20px 24px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      }
      .stat-card .stat-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9a9189;
        margin-bottom: 6px;
      }
      .stat-card .stat-value {
        font-family: 'DM Serif Display', serif;
        font-size: 28px;
        color: #1a1a1a;
      }
      .stat-card .stat-value.accent-green { color: #2d8a5e; }
      .stat-card .stat-value.accent-warm  { color: #7c6f5e; }

      /* Table container */
      .table-wrap {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        overflow: hidden;
      }
      .table-wrap table {
        width: 100%;
        font-size: 14px;
        border-collapse: collapse;
      }
      .table-wrap thead tr {
        border-bottom: 1.5px solid #e8e3dc;
      }
      .table-wrap thead th {
        text-align: left;
        padding: 16px 24px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9a9189;
      }
      .table-wrap thead th:last-child { text-align: right; }
      .table-wrap tbody tr {
        border-bottom: 1px solid #f0ece6;
        transition: background 0.15s;
      }
      .table-wrap tbody tr:hover {
        background: #faf8f5;
      }
      .table-wrap tbody td {
        padding: 14px 24px;
        color: #6b6259;
      }

      /* Avatar circle */
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, #d6d0c8, #b0a898);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        flex-shrink: 0;
      }

      /* Role badge */
      .role-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: #f0ece6;
        color: #6b6259;
        border: 1px solid #e8e3dc;
      }

      /* Delete button in table */
      .delete-btn {
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        color: #c0392b;
        background: rgba(192,57,43,0.08);
        border: 1px solid rgba(192,57,43,0.15);
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .delete-btn:hover {
        background: rgba(192,57,43,0.15);
        border-color: rgba(192,57,43,0.3);
      }

      /* Search input */
      .search-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1.5px solid #ddd8d0;
        border-radius: 10px;
        padding: 10px 14px;
        width: 240px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .search-wrap:focus-within {
        border-color: #7c6f5e;
        box-shadow: 0 0 0 3px rgba(124,111,94,0.1);
      }
      .search-wrap input {
        background: transparent;
        border: none;
        outline: none;
        font-size: 14px;
        color: #1a1a1a;
        width: 100%;
        font-family: 'DM Sans', sans-serif;
      }
      .search-wrap input::placeholder { color: #b0a898; }

      /* Modal overlay */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal-card {
        background: #fff;
        border-radius: 20px;
        padding: 32px;
        width: 100%;
        max-width: 400px;
        margin: 0 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      }
      .btn-cancel {
        flex: 1;
        padding: 12px 20px;
        border-radius: 10px;
        border: 1.5px solid #d6d0c8;
        background: transparent;
        color: #6b6259;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        font-family: 'DM Sans', sans-serif;
      }
      .btn-cancel:hover {
        background: #f0ece6;
        border-color: #b0a898;
      }
      .btn-primary {
        background: #1a1a1a;
        color: #fff;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        transition: background 0.2s, transform 0.15s;
      }
      .btn-primary:hover {
        background: #333;
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .btn-primary:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
      .form-input {
        background: #faf8f5;
        border: 1.5px solid #ddd8d0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        width: 100%;
        outline: none;
        transition: border-color 0.2s;
        font-family: 'DM Sans', sans-serif;
      }
      .form-input:focus {
        border-color: #7c6f5e;
      }
      .form-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9a9189;
        margin-bottom: 4px;
        display: block;
      }
      .btn-delete {
        flex: 1;
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        background: #c0392b;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s, transform 0.15s;
        font-family: 'DM Sans', sans-serif;
      }
      .btn-delete:hover { background: #a93226; }
      .btn-delete:active { transform: scale(0.98); }

      /* Empty & Loading states */
      .state-message {
        text-align: center;
        padding: 60px 20px;
        color: #9a9189;
      }

      /* Spinner */
      .spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid #e8e3dc;
        border-top-color: #7c6f5e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        background: #1a1a1a;
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 14px;
        z-index: 999;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s, transform 0.3s;
      }
      .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="flex">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">EstateView</div>
        <div class="brand-sub">Admin Panel</div>

        <nav>
            <a href="adminDashboard.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Dashboard
            </a>
            <a href="AdminView.html" class="active">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Users
            </a>
            <a href="adminProperties.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
                Properties
            </a>
            <a href="adminInquire.html">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                </svg>
                Inquiries
            </a>
        </nav>

        <button onclick="logout()" class="logout-btn">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Logout
        </button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10 overflow-x-auto">

        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl text-stone-900 leading-none">User Management</h1>
                <p class="text-sm text-stone-400 mt-1">Manage all registered users</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="search-wrap">
                    <svg width="16" height="16" fill="none" stroke="#b0a898" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input id="searchInput" type="text" placeholder="Search users…"
                        oninput="filterUsers()"/>
                </div>
                <button class="btn-primary" onclick="openCreateModal()">+ Create User</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-5 mb-8">
            <div class="stat-card">
                <p class="stat-label">Total Users</p>
                <p id="totalCount" class="stat-value">—</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Active</p>
                <p id="activeCount" class="stat-value accent-green">—</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Showing</p>
                <p id="showingCount" class="stat-value accent-warm">—</p>
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>

            <!-- Empty -->
            <div id="emptyState" class="hidden state-message">
                <svg class="w-10 h-10 mx-auto mb-3 opacity-40" fill="none" stroke="#9a9189" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <p class="text-sm text-stone-500">No users found</p>
            </div>

            <!-- Loading -->
            <div id="loadingState" class="state-message">
                <div class="spinner"></div>
                <p class="text-sm text-stone-500">Loading users…</p>
            </div>
        </div>
    </main>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="flex items-center gap-4 mb-4">
                <div style="width:44px;height:44px;border-radius:50%;background:rgba(192,57,43,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <svg width="22" height="22" fill="none" stroke="#c0392b" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg text-stone-900 serif">Delete User</h3>
                    <p id="deleteModalSubtitle" class="text-sm text-stone-400">This action cannot be undone.</p>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeModal()" class="btn-cancel">
                    Cancel
                </button>
                <button onclick="confirmDelete()" class="btn-delete">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Create User Modal -->
    <div id="createModal" class="modal-overlay hidden">
        <div class="modal-card" style="max-width: 500px;">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl text-stone-900 serif">Create New User</h3>
                <button onclick="closeCreateModal()" class="text-stone-400 hover:text-stone-700 text-2xl leading-none">&times;</button>
            </div>
            <div class="flex flex-col gap-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">Name</label>
                        <input type="text" id="c-name" class="form-input" placeholder="e.g. John Doe" />
                    </div>
                    <div>
                        <label class="form-label">Username</label>
                        <input type="text" id="c-username" class="form-input" placeholder="johndoe" />
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">Email</label>
                        <input type="email" id="c-email" class="form-input" placeholder="john@example.com" />
                    </div>
                    <div>
                        <label class="form-label">Phone Number</label>
                        <input type="text" id="c-phone" class="form-input" placeholder="071 234 5678" />
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">Role</label>
                        <select id="c-role" class="form-input">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Password</label>
                        <input type="password" id="c-password" class="form-input" placeholder="••••••••" />
                    </div>
                </div>
                <button class="btn-primary w-full mt-4" id="create-btn" onclick="createUser()">Create User</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = "http://localhost:8080";
        let allUsers = [];
        let deleteTargetId = null;

        async function fetchUsers() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/users`);
                if (!res.ok) throw new Error("Failed to fetch");
                const data = await res.json();

                allUsers = data;

                document.getElementById("loadingState").classList.add("hidden");
                updateStats(allUsers.length);
                renderTable(allUsers);
            } catch (err) {
                document.getElementById("loadingState").innerHTML =
                    `<p class="text-sm" style="color:#c0392b;padding:60px 20px;text-align:center;">Failed to load users. Is the server running?</p>`;
            }
        }

        function renderTable(users) {
            const tbody = document.getElementById("usersTableBody");
            const empty = document.getElementById("emptyState");

            if (users.length === 0) {
                tbody.innerHTML = "";
                empty.classList.remove("hidden");
                document.getElementById("showingCount").textContent = 0;
                return;
            }

            empty.classList.add("hidden");
            document.getElementById("showingCount").textContent = users.length;

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td style="font-family:monospace;font-size:12px;color:#9a9189;">#${u.id}</td>
                    <td>
                        <div class="flex items-center gap-3">
                            <div class="avatar">
                                ${u.name.charAt(0).toUpperCase()}
                            </div>
                            <span style="font-weight:500;color:#1a1a1a;">${u.name}</span>
                        </div>
                    </td>
                    <td>${u.email}</td>
                    <td>${u.phone ?? '—'}</td>
                    <td>
                        <span class="role-badge" style="${u.role === 'admin' ? 'background:#fef3c7;color:#92400e;border-color:#fde68a;' : ''}">
                            ${u.role}
                        </span>
                    </td>
                    <td style="text-align:right;">
                        <button onclick="openDeleteModal(${u.id}, '${u.name}')"
                            class="delete-btn">
                            Delete
                        </button>
                    </td>
                </tr>
            `).join("");
        }

        function filterUsers() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allUsers.filter(u =>
                u.name.toLowerCase().includes(q) ||
                u.email.toLowerCase().includes(q) ||
                String(u.id).includes(q)
            );
            renderTable(filtered);
        }

        function updateStats(total) {
            document.getElementById("totalCount").textContent = total;
            document.getElementById("activeCount").textContent = total;
            document.getElementById("showingCount").textContent = total;
        }

        function openDeleteModal(id, name) {
            deleteTargetId = id;
            document.getElementById("deleteModalSubtitle").textContent = `Are you sure you want to delete "${name}"?`;
            document.getElementById("deleteModal").classList.remove("hidden");
        }

        function closeModal() {
            deleteTargetId = null;
            document.getElementById("deleteModal").classList.add("hidden");
        }

        async function confirmDelete() {
            if (!deleteTargetId) return;
            try {
                const res = await fetch(`${API_BASE}/api/admin/user/${deleteTargetId}`, { method: "DELETE" });
                if (!res.ok) throw new Error("Delete failed");
                allUsers = allUsers.filter(u => u.id !== deleteTargetId);
                updateStats(allUsers.length);
                renderTable(allUsers);
                showToast("User deleted successfully");
            } catch (err) {
                alert("Failed to delete user. Please try again.");
            } finally {
                closeModal();
            }
        }

        function openCreateModal() {
            document.getElementById("createModal").classList.remove("hidden");
        }

        function closeCreateModal() {
            document.getElementById("createModal").classList.add("hidden");
            // clear fields
            document.getElementById("c-name").value = "";
            document.getElementById("c-username").value = "";
            document.getElementById("c-email").value = "";
            document.getElementById("c-phone").value = "";
            document.getElementById("c-password").value = "";
            document.getElementById("c-role").value = "user";
        }

        async function createUser() {
            const btn = document.getElementById("create-btn");
            const name = document.getElementById("c-name").value;
            const username = document.getElementById("c-username").value;
            const email = document.getElementById("c-email").value;
            const phoneNumber = document.getElementById("c-phone").value;
            const password = document.getElementById("c-password").value;
            const role = document.getElementById("c-role").value;

            if (!name || !username || !email || !password || !phoneNumber) {
                showToast("Please fill all required fields");
                return;
            }

            btn.textContent = "Creating...";
            btn.disabled = true;

            const payload = { name, username, password, phoneNumber, role, email };

            try {
                const res = await fetch(`${API_BASE}/api/admin/user`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) throw new Error("Create failed");
                
                showToast("User created successfully!");
                closeCreateModal();
                fetchUsers(); // Refresh the list
            } catch (err) {
                showToast("Failed to create user");
            } finally {
                btn.textContent = "Create User";
                btn.disabled = false;
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 3000);
        }

        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "../user/login.html";
        }

        document.getElementById("deleteModal").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById("createModal").addEventListener("click", function(e) {
            if (e.target === this) closeCreateModal();
        });

        fetchUsers();
    </script>
</body>
</html>
