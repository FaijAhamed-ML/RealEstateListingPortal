<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings — EstateView</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { font-family: 'DM Sans', sans-serif; }
      h1, h2, .serif { font-family: 'DM Serif Display', serif; }
      body { background-color: #f5f2ee; min-height: 100vh; }

      .card { background: #fff; border-radius: 16px; overflow: hidden; transition: transform 0.25s ease, box-shadow 0.25s ease; }
      .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.10); }
      .img-wrap { width: 100%; aspect-ratio: 4/3; overflow: hidden; background: #e8e3dc; position: relative; }
      .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
      .card:hover .img-wrap img { transform: scale(1.04); }
      .img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #b0a898; font-size: 13px; }
      .price { font-family: 'DM Serif Display', serif; font-size: 22px; color: #1a1a1a; }
      .badge { background: #1a1a1a; color: #fff; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; }

      .btn-primary { background: #1a1a1a; color: #fff; border-radius: 10px; padding: 12px 28px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: background 0.2s, transform 0.15s; }
      .btn-primary:hover { background: #333; }
      .btn-primary:active { transform: scale(0.98); }
      .btn-outline { background: transparent; border: 1.5px solid #d6d0c8; color: #6b6259; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; text-decoration: none; }
      .btn-outline:hover { background: #f0ece6; }

      .stat-card { background: #fff; border-radius: 16px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
      .stat-card .stat-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9a9189; margin-bottom: 6px; }
      .stat-card .stat-value { font-family: 'DM Serif Display', serif; font-size: 28px; color: #1a1a1a; }

      .skeleton { background: linear-gradient(90deg, #ede8e1 25%, #e2ddd6 50%, #ede8e1 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

      .toast { position: fixed; bottom: 28px; right: 28px; background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 999; opacity: 0; transform: translateY(12px); transition: opacity 0.3s, transform 0.3s; }
      .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="properties.html" class="btn-outline" style="padding: 8px 18px; border-radius: 10px; font-size: 13px;">← Back to Listings</a>
                <div>
                    <h1 class="text-2xl text-stone-900 leading-none">EstateView</h1>
                    <p class="text-xs text-stone-400 mt-0.5 tracking-wide uppercase">My Listings</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button class="btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <!-- Stats -->
    <div class="max-w-6xl mx-auto px-6 mt-8">
        <div class="grid grid-cols-3 gap-5 mb-8">
            <div class="stat-card">
                <p class="stat-label">My Listings</p>
                <p id="totalCount" class="stat-value">—</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Total Value</p>
                <p id="totalValue" class="stat-value" style="font-size:22px; color:#2d8a5e;">—</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Showing</p>
                <p id="showingCount" class="stat-value" style="color:#7c6f5e;">—</p>
            </div>
        </div>
    </div>

    <!-- Search -->
    <div class="max-w-6xl mx-auto px-6 mb-6">
        <input type="text" id="searchInput" placeholder="Search your listings…" oninput="filterListings()"
            style="background:#fff; border:1.5px solid #ddd8d0; border-radius:10px; padding:10px 14px; font-size:14px; width:260px; outline:none; font-family:'DM Sans',sans-serif;" />
    </div>

    <!-- Grid -->
    <main class="max-w-6xl mx-auto px-6 pb-10">
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <div id="emptyState" class="hidden text-center py-20 text-stone-400">
            <p class="text-5xl mb-4">🏠</p>
            <p class="text-lg">You haven't listed any properties yet.</p>
            <a href="properties.html" class="btn-primary mt-4" style="display:inline-block; margin-top:16px;">Browse & List Properties</a>
        </div>
        <div id="loadingState" class="text-center py-20 text-stone-400">
            <div style="width:24px;height:24px;border:2.5px solid #e8e3dc;border-top-color:#7c6f5e;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;"></div>
            <p class="text-sm text-stone-500">Loading your listings…</p>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </main>

    <!-- Edit Modal (Simplified from properties.html) -->
    <div id="modal-bg" style="position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:100; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s;" onclick="closeModalOutside(event)">
        <div id="modal" style="background:#fff; border-radius:20px; width:92%; max-width:520px; padding:32px; transform:scale(0.96); transition:transform 0.2s;">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl text-stone-900 serif" id="modal-title">Edit Property</h2>
                <button onclick="closeModal()" class="text-stone-400 hover:text-stone-700 text-2xl leading-none">&times;</button>
            </div>
            <div class="flex flex-col gap-4">
                <input type="hidden" id="f-propertyId" />
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1 block">Value (LKR)</label>
                        <input type="number" id="f-value" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5" />
                    </div>
                    <div>
                        <label class="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1 block">Contact</label>
                        <input type="text" id="f-contact" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5" />
                    </div>
                </div>
                <div>
                    <label class="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1 block">Location</label>
                    <input type="text" id="f-location" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5" />
                </div>
                <div>
                    <label class="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1 block">Details</label>
                    <input type="text" id="f-details" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5" />
                </div>
                <div>
                    <label class="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1 block">Description</label>
                    <textarea id="f-description" rows="2" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5"></textarea>
                </div>
                <div>
                    <label class="text-xs font-medium text-stone-500 uppercase tracking-wide mb-1 block">Add New Images (Optional)</label>
                    <input type="file" id="f-image" accept="image/png,image/jpeg" multiple class="w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200" />
                </div>
                <button class="btn-primary w-full mt-2" id="submit-btn" onclick="submitEdit()">Update Property</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = 'http://localhost:8080';
        let myProperties = [];

        async function fetchMyListings() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyState').innerHTML = `
                    <p class="text-5xl mb-4">🔒</p>
                    <p class="text-lg text-stone-600">Please log in to view your listings.</p>
                    <a href="../user/login.html" class="btn-primary mt-4" style="display:inline-block; margin-top:16px;">Log In</a>`;
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/property/${userId}`);
                if (!res.ok) throw new Error('Failed to fetch');
                myProperties = await res.json();
                document.getElementById('loadingState').classList.add('hidden');
                updateStats();
                renderGrid(myProperties);
            } catch (e) {
                document.getElementById('loadingState').innerHTML =
                    `<p class="text-sm" style="color:#c0392b;text-align:center;padding:60px 20px;">Failed to load your listings. Is the server running?</p>`;
            }
        }

        function renderGrid(list) {
            const grid = document.getElementById('grid');
            const empty = document.getElementById('emptyState');

            if (!list.length) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                document.getElementById('showingCount').textContent = 0;
                return;
            }

            empty.classList.add('hidden');
            document.getElementById('showingCount').textContent = list.length;

            grid.innerHTML = list.map(p => {
                const imgSrc = (p.imagePaths && p.imagePaths.length > 0) ? `${API_BASE}/property-images/${p.imagePaths[0]}` : null;
                const formatted = new Intl.NumberFormat('en-LK', { style: 'currency', currency: 'LKR', maximumFractionDigits: 0 }).format(p.value);
                return `
                <div class="card" data-id="${p.propertyId}">
                    <div class="img-wrap" onclick="viewProperty(${p.propertyId})" style="cursor:pointer;">
                        ${imgSrc
                          ? `<img src="${imgSrc}" alt="Property image" onerror="this.parentElement.innerHTML='<div class=\\'img-placeholder\\'>No image</div>'" />`
                          : `<div class="img-placeholder">No image</div>`}
                        <div class="absolute top-3 left-3 flex gap-2">
                            <span class="badge">Property #${p.propertyId}</span>
                        </div>
                    </div>
                    <div class="p-4 flex flex-col gap-2">
                        <div class="flex justify-between items-start">
                            <p class="price" onclick="viewProperty(${p.propertyId})" style="cursor:pointer;">${formatted}</p>
                            <div class="flex gap-2">
                                <button onclick="openEditModal(${p.propertyId})" class="p-1.5 text-stone-400 hover:text-stone-900 transition-colors" title="Edit">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                </button>
                                <button onclick="confirmDelete(${p.propertyId})" class="p-1.5 text-stone-400 hover:text-red-600 transition-colors" title="Delete">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                </button>
                            </div>
                        </div>
                        ${p.details ? `<p class="text-sm font-medium text-stone-700">${p.details}</p>` : ''}
                        ${p.description ? `<p class="text-sm text-stone-500 leading-relaxed line-clamp-2">${p.description}</p>` : ''}
                        <div class="flex flex-wrap gap-3 mt-1 pt-3 border-t border-stone-100 text-xs text-stone-400">
                            ${p.location ? `<span>📍 ${p.location}</span>` : ''}
                            ${p.contactNumber ? `<span>📞 ${p.contactNumber}</span>` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function filterListings() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = myProperties.filter(p =>
                (p.description || '').toLowerCase().includes(q) ||
                (p.details || '').toLowerCase().includes(q) ||
                (p.location || '').toLowerCase().includes(q)
            );
            renderGrid(filtered);
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = myProperties.length;
            const total = myProperties.reduce((s, p) => s + (p.value || 0), 0);
            document.getElementById('totalValue').textContent = new Intl.NumberFormat('en-LK', { style: 'currency', currency: 'LKR', maximumFractionDigits: 0 }).format(total);
            document.getElementById('showingCount').textContent = myProperties.length;
        }

        function viewProperty(propertyId) {
            const property = myProperties.find(p => p.propertyId === propertyId);
            if (property) {
                localStorage.setItem('selectedProperty', JSON.stringify(property));
                window.location.href = 'property.html';
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function submitEdit() {
            const btn = document.getElementById('submit-btn');
            const propertyId = document.getElementById('f-propertyId').value;
            const formData = new FormData();
            formData.append('userId', localStorage.getItem('userId'));
            formData.append('value', document.getElementById('f-value').value);
            formData.append('details', document.getElementById('f-details').value);
            formData.append('description', document.getElementById('f-description').value);
            formData.append('location', document.getElementById('f-location').value);
            formData.append('contactNumber', document.getElementById('f-contact').value);
            
            const imageFiles = document.getElementById('f-image').files;
            for (let i = 0; i < imageFiles.length; i++) {
                formData.append('images', imageFiles[i]);
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const res = await fetch(`${API_BASE}/property/${propertyId}`, {
                    method: 'PUT',
                    body: formData
                });
                if (!res.ok) throw new Error('Update failed');
                showToast('Property updated successfully!');
                closeModal();
                fetchMyListings();
            } catch (e) {
                showToast('Failed to update property.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Update Property';
            }
        }

        async function confirmDelete(id) {
            if (confirm('Are you sure you want to delete this property? This action cannot be undone.')) {
                try {
                    const res = await fetch(`${API_BASE}/property/${id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('Delete failed');
                    showToast('Property deleted successfully.');
                    fetchMyListings();
                } catch (e) {
                    showToast('Failed to delete property.');
                }
            }
        }

        function openEditModal(id) {
            const p = myProperties.find(prop => prop.propertyId === id);
            if (!p) return;
            document.getElementById('f-propertyId').value = p.propertyId;
            document.getElementById('f-value').value = p.value;
            document.getElementById('f-details').value = p.details;
            document.getElementById('f-location').value = p.location;
            document.getElementById('f-contact').value = p.contactNumber;
            document.getElementById('f-description').value = p.description || '';
            document.getElementById('f-image').value = '';
            
            const modalBg = document.getElementById('modal-bg');
            modalBg.style.opacity = '1';
            modalBg.style.pointerEvents = 'all';
            document.getElementById('modal').style.transform = 'scale(1)';
        }

        function closeModal() {
            const modalBg = document.getElementById('modal-bg');
            modalBg.style.opacity = '0';
            modalBg.style.pointerEvents = 'none';
            document.getElementById('modal').style.transform = 'scale(0.96)';
        }

        function closeModalOutside(e) {
            if (e.target.id === 'modal-bg') closeModal();
        }

        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '../user/login.html';
        }

        fetchMyListings();
    </script>
</body>
</html>
